}

function drawCrates(c) {
  var list = [{ b: crate, s: 42 }];
  for (var i = 0; i < list.length; i++) {
    var e = list[i];
    c.save();
    c.translate(e.b.position.x, e.b.position.y);
    c.rotate(e.b.angle);
    c.fillStyle = '#000000';
    c.beginPath();
    c.rect(-e.s, -e.s, e.s * 2, e.s * 2);
    c.fill();
    /* shape-only notches keep it pure black yet readable as a crate */
    c.beginPath();
    c.rect(-e.s - 4, -e.s + 8, 4, 10);
    c.rect(e.s, e.s - 24, 4, 10);
    c.fill();
    c.restore();
  }
}

function drawRope(c) {
  c.strokeStyle = '#000000';
  c.lineCap = 'round';
  c.lineWidth = 6;
  for (var r = 0; r < ROPES.length; r++) {
    var rope = ROPES[r];
    c.beginPath();
    c.moveTo(rope.pin.x, rope.pin.y);
    for (var i = 0; i < rope.segments.length; i++) {
      c.lineTo(rope.segments[i].position.x, rope.segments[i].position.y);
    }
    c.stroke();
    /* knot at the end */
    var last = rope.segments[rope.segments.length - 1].position;
    c.fillStyle = '#000000';
    c.beginPath();
    c.arc(last.x, last.y + 12, 7, 0, Math.PI * 2);
    c.fill();
  }
}

/* ============================== props: wheels, cart, seesaw, light poles ============================== */

/* spoked wheel sprite (transparent gaps read against the fog) — cached per radius */
var wheelSprites = {};
function wheelSprite(r) {
  var s = wheelSprites[r];
  if (s) return s;
  var size = Math.ceil(r * 2 + 4);
  s = document.createElement('canvas');
  s.width = size; s.height = size;
  var c = s.getContext('2d');
  c.translate(size / 2, size / 2);
  c.fillStyle = '#000000';
  c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
  /* punch 4 windows between the spokes */
  c.globalCompositeOperation = 'destination-out';
  for (var i = 0; i < 4; i++) {
    var a0 = i * Math.PI / 2 + 0.26, a1 = (i + 1) * Math.PI / 2 - 0.26;
    c.beginPath();
    c.arc(0, 0, r * 0.74, a0, a1);
    c.arc(0, 0, r * 0.3, a1, a0, true);
    c.closePath();
    c.fill();
  }
  c.globalCompositeOperation = 'source-over';
  wheelSprites[r] = s;
  return s;
}

function drawWheelBody(c, body, r) {
  var s = wheelSprite(r);
  c.save();
  c.translate(body.position.x, body.position.y);
  c.rotate(body.angle);
  c.drawImage(s, -s.width / 2, -s.height / 2);
  c.restore();
}

function drawWheels(c) {
  drawWheelBody(c, wheel1, 85);
  drawWheelBody(c, wheel2, 60);
}

function drawCart(c) {
  c.save();
  c.translate(cartDeck.position.x, cartDeck.position.y);
  c.rotate(cartDeck.angle);
  c.fillStyle = '#000000';
  c.beginPath();
  c.roundRect(-120, -13, 240, 26, 5);
  c.fill();
  /* side rails + a worn handle, silhouette detail */
  c.beginPath();
  c.rect(-120, -24, 7, 13);
  c.rect(113, -24, 7, 13);
  c.fill();
  c.restore();
  drawWheelBody(c, cartWheels[0], 40);
  drawWheelBody(c, cartWheels[1], 40);
}

function drawSeesaw(c) {
  /* stone pivot rising from the pool */
  c.fillStyle = '#000000';
  c.beginPath();
  c.moveTo(8400, 906);
  c.lineTo(8366, 1010);
  c.lineTo(8434, 1010);
  c.closePath();
  c.fill();
  /* plank */
  c.save();
  c.translate(plank.position.x, plank.position.y);
  c.rotate(plank.angle);
  c.beginPath();
  c.roundRect(-280, -8, 560, 16, 3);
  c.fill();
  c.restore();
}

/* --- Limbo street lamps: leaning black poles, hanging lamp, hot glow, drips --- */
var LIGHT_POLES = [
  { x: 1564,  baseY: 903, h: 250, arm: -74, drip: true,  ph: 0.7 },
  { x: 5862,  baseY: 903, h: 235, arm: -60, drip: true,  ph: 2.3 },
  { x: 8032,  baseY: 903, h: 262, arm: 84,  drip: true,  ph: 4.1 },
  { x: 9520,  baseY: 903, h: 245, arm: 56,  drip: false, ph: 1.5 },
  { x: 12330, baseY: 738, h: 285, arm: 92,  drip: false, ph: 5.2 }
];

function lampPos(pole, t) {
  var sway = Math.sin(t * 0.7 + pole.ph) * 0.05;
  var ax = pole.x + pole.arm;
  var ay = pole.baseY - pole.h + 8;
  return { x: ax + Math.sin(sway) * 16, y: ay + 14 + Math.cos(sway) * 4, sway: sway };
}

var drips = [];      // { x, y, vy, pool } falling droplets
var splashes = [];   // { x, y, r, life } expanding rings on the water

function poolAt(x) {
  for (var i = 0; i < WATERS.length; i++) {
    if (x >= WATERS[i].x0 && x <= WATERS[i].x1) return WATERS[i];
  }
  return null;
}

function updateDrips() {
  var t = tickCount / 60;
  for (var i = 0; i < LIGHT_POLES.length; i++) {
    var pole = LIGHT_POLES[i];
    if (!pole.drip) continue;
    var every = 80 + ((i * 47) % 60);
    if ((tickCount + i * 31) % every === 0) {
      var lp = lampPos(pole, t);
      drips.push({ x: lp.x + (Math.random() - 0.5) * 6, y: lp.y + 8, vy: 0.6 });
    }
  }
  for (var d = drips.length - 1; d >= 0; d--) {
    var dr = drips[d];
    dr.vy += 0.5;
    dr.y += dr.vy;
    var pool = poolAt(dr.x);
    var hitY = pool ? surfaceAt(pool, dr.x, t) : 902;
    if (dr.y >= hitY) {
      if (pool) splashes.push({ x: dr.x, y: hitY, r: 2, life: 1 });
      drips.splice(d, 1);
    }
  }
  for (var s2 = splashes.length - 1; s2 >= 0; s2--) {
    var sp = splashes[s2];
    sp.r += 0.85;
    sp.life -= 0.03;
    if (sp.life <= 0) splashes.splice(s2, 1);
  }
}

function poleFlick(pole, t) {
  /* irregular flicker — never fully steady */
  return 0.78 + 0.13 * Math.sin(t * 8.3 + pole.ph) * Math.sin(t * 2.6 + pole.ph * 2) + 0.09 * Math.sin(t * 0.9 + pole.ph);
}

/* lamp light blooms OVER the vignette — real light sources punch through the dark */
function drawLampGlows(c) {
  var t = tickCount / 60;
  c.globalCompositeOperation = 'lighter';            // additive: a true bloom
  for (var i = 0; i < LIGHT_POLES.length; i++) {
    var pole = LIGHT_POLES[i];
    if (Math.abs(pole.x - cam.x) > viewW * 0.75) continue;
    var lp = lampPos(pole, t);
    var flick = poleFlick(pole, t);
    c.globalAlpha = 0.1 * flick;
    c.drawImage(glowSprite, lp.x - 200, lp.y - 200, 400, 400);
    c.globalAlpha = 0.3 * flick;
    c.drawImage(glowSprite, lp.x - 100, lp.y - 100, 200, 200);
    c.globalAlpha = 0.55 * flick;
    c.drawImage(glowSprite, lp.x - 42, lp.y - 42, 84, 84);
    c.globalAlpha = 1;
  }
  c.globalCompositeOperation = 'source-over';
  for (i = 0; i < LIGHT_POLES.length; i++) {
    var pole2 = LIGHT_POLES[i];
    if (Math.abs(pole2.x - cam.x) > viewW * 0.75) continue;
    var lp2 = lampPos(pole2, t);
    /* hot core inside the lamp box */
    c.save();
    c.translate(lp2.x, lp2.y);
    c.rotate(lp2.sway);
    c.fillStyle = '#ffffff';
    c.globalAlpha = 0.92 * poleFlick(pole2, t);
    c.fillRect(-5, -3, 10, 7);
    c.globalAlpha = 1;
    c.restore();
  }
}

function drawLightPoles(c) {
  var t = tickCount / 60;
  for (var i = 0; i < LIGHT_POLES.length; i++) {
    var pole = LIGHT_POLES[i];
    var topY = pole.baseY - pole.h;
    var lp = lampPos(pole, t);
    var flick = poleFlick(pole, t);
    /* pole: tapered, slightly leaning post with a foot mound */
    c.fillStyle = '#000000';
    var leanT = pole.arm * 0.06;
    c.beginPath();
    c.moveTo(pole.x - 6, pole.baseY + 4);
    c.quadraticCurveTo(pole.x - 4, pole.baseY - pole.h * 0.55, pole.x - 3 + leanT, topY);
    c.lineTo(pole.x + 3.4 + leanT, topY);
    c.quadraticCurveTo(pole.x + 5, pole.baseY - pole.h * 0.5, pole.x + 6.5, pole.baseY + 4);
    c.closePath();
    c.fill();
    /* arm + brace */
    c.strokeStyle = '#000000';
    c.lineCap = 'round';
    c.lineWidth = 5;
    c.beginPath();
    c.moveTo(pole.x + leanT, topY + 6);
    c.quadraticCurveTo(pole.x + pole.arm * 0.55 + leanT, topY + 2, pole.x + pole.arm, topY + 8);
    c.stroke();
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(pole.x + leanT * 0.8, topY + 40);
    c.lineTo(pole.x + pole.arm * 0.62, topY + 9);
    c.stroke();
    /* hanging lamp box */
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(pole.x + pole.arm, topY + 8);
    c.lineTo(lp.x, lp.y - 7);
    c.stroke();
    c.save();
    c.translate(lp.x, lp.y);
    c.rotate(lp.sway);
    c.fillRect(-9, -8, 18, 15);
    c.restore();
  }
  /* droplets + rings */
  c.strokeStyle = 'rgba(210,210,210,0.55)';
  c.lineWidth = 1.4;
  c.beginPath();
  for (var d = 0; d < drips.length; d++) {
    c.moveTo(drips[d].x, drips[d].y - 7);
    c.lineTo(drips[d].x, drips[d].y);
  }
  c.stroke();
  for (var s2 = 0; s2 < splashes.length; s2++) {
    var sp = splashes[s2];
    c.strokeStyle = 'rgba(190,190,190,' + (0.4 * sp.life).toFixed(3) + ')';
    c.beginPath();
    c.ellipse(sp.x, sp.y, sp.r, sp.r * 0.32, 0, 0, Math.PI * 2);
    c.stroke();
  }
}

function drawEndGlow(c) {
  var t = tickCount / 60;
  for (var i = 0; i < 3; i++) {
    var gx = 12920 + i * 32 + Math.sin(t * 0.9 + i * 2.1) * 14;
    var gy = 655 + Math.sin(t * 1.3 + i * 1.4) * 18 - i * 26;
    var r = 26 + Math.sin(t * 2 + i) * 5;
    var g = c.createRadialGradient(gx, gy, 0, gx, gy, r);
    g.addColorStop(0, 'rgba(255,255,255,0.5)');
    g.addColorStop(0.25, 'rgba(255,255,255,0.12)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g;
    c.beginPath();
    c.arc(gx, gy, r, 0, Math.PI * 2);
    c.fill();
  }
}

/* ============================== frame render ============================== */

var mistDrift = 0;

function render() {
  var W = canvas.width, H = canvas.height;
  var sc = dpr * zoom;
  var bc = bg.c, bw = bg.w, bh = bg.h;

  /* === the entire atmospheric stack renders at half resolution into bg,
     then is upscaled once — cheap on the raster thread, and the soft
     upscale doubles as atmospheric depth blur === */
  bc.setTransform(1, 0, 0, 1, 0, 0);

  /* --- sky: near-black, claustrophobic — the world lives in darkness --- */
  var sky = bc.createLinearGradient(0, 0, 0, bh);
  sky.addColorStop(0, '#181818');
  sky.addColorStop(0.5, '#383838');
  sky.addColorStop(1, '#040404');
  bc.fillStyle = sky;
  bc.fillRect(0, 0, bw, bh);
  /* --- the ONLY light: a glowing wall of fog dead-center in the background --- */
  var corePulse = 0.92 + 0.08 * Math.sin(tickCount / 60 * 0.21);
  bc.globalAlpha = 0.85 * corePulse;
  bc.drawImage(glowSprite, bw * 0.5 - bw * 0.52, bh * 0.42 - bw * 0.52, bw * 1.04, bw * 1.04);
  bc.globalAlpha = 0.8 * corePulse;
  bc.drawImage(glowSprite, bw * 0.5 - bw * 0.28, bh * 0.40 - bw * 0.28, bw * 0.56, bw * 0.56);
  bc.globalAlpha = 1;

  /* --- parallax layers, driven by the camera's LERP coordinates --- */
  mistDrift += 0.12;
  for (var li = 0; li < layers.length; li++) {
    var L = layers[li];
    bc.setTransform(bg.scl, 0, 0, bg.scl, bw / 2, bh / 2);
    bc.globalAlpha = L.alpha;
    var px = cam.x * L.factor;
    var voff = Math.max(-60, Math.min(60, -(cam.y - 760) * L.factor * 0.35));
    var tileY = viewH / 2 - 828;          // keeps the tile ground band pinned to the frame bottom at any zoom
    var k0 = Math.floor((px - viewW / 2) / TILE_W);
    for (var k = k0; k * TILE_W - px < viewW / 2; k++) {
      bc.drawImage(L.tile, k * TILE_W - px, tileY + voff);
    }
    bc.globalAlpha = 1;

    /* drifting mist bands between layers */
    if (li < 2) {
      bc.setTransform(1, 0, 0, 1, 0, 0);
      var mw = bw * 0.7;
      var mx = ((mistDrift * (li + 1) * 0.35) % (bw + mw)) - mw + (li === 0 ? 0 : bw * 0.4);
      var my = bh * (0.45 + li * 0.18);
      bc.globalAlpha = 0.05;
      bc.drawImage(glowSprite, mx, my - mw * 0.18, mw, mw * 0.36);
      bc.globalAlpha = 1;
    }
    if (li === 0) drawGlowPockets();   // bright fog pockets behind the mid/near trees
  }

  drawTreeBand(TREE_BANDS[0], false);
  drawTreeBand(TREE_BANDS[1], true);
  drawGodRays();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg.canvas, 0, 0, W, H);

  /* --- world space: pure black silhouettes --- */
  ctx.setTransform(sc, 0, 0, sc, W / 2 - cam.x * sc, H / 2 - cam.y * sc);
  drawTerrain(ctx);
  drawGrass(ctx);
  drawGallowsTree(ctx);
  drawWorldTrees(ctx);
  drawEndGlow(ctx);
  drawCrates(ctx);
  drawSeesaw(ctx);
  drawWheels(ctx);
  drawCart(ctx);
  drawRope(ctx);
  drawWater(ctx);
  drawLogs(ctx);
  drawWaterSurface(ctx);
  drawLightPoles(ctx);
  drawBoy(ctx);

  /* --- colossal black foreground trunks pass in front of everything --- */
  drawForegroundTrunks();

  /* --- post stack --- */
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(vignetteCanvas, 0, 0);

  /* lamp glows bloom through the vignette */
  ctx.setTransform(sc, 0, 0, sc, W / 2 - cam.x * sc, H / 2 - cam.y * sc);
  drawLampGlows(ctx);
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  /* heavy film grain: 'overlay' keeps pure blacks pure */
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.18;
  var tile = grainTiles[tickCount % grainTiles.length];
  var gs = 256 * 2.5 * dpr;
  var ox = -((Math.random() * 256) | 0), oy = -((Math.random() * 256) | 0);
  for (var gy = oy; gy < H; gy += gs) {
    for (var gx = ox; gx < W; gx += gs) {
      ctx.drawImage(tile, gx, gy, gs, gs);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  /* drowning fade-to-black / respawn fade-in */
  if (drown.fade > 0) {
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, drown.fade).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ============================== main loop: fixed-step physics ============================== */

var acc = 0, lastTs = 0;
var fpsSamples = [], fpsAvg = 60;

function frame(ts) {
  if (lastTs === 0) lastTs = ts;
  var elapsed = Math.min(ts - lastTs, 100);
  lastTs = ts;

  fpsSamples.push(elapsed);
  if (fpsSamples.length > 60) fpsSamples.shift();
  var sum = 0;
  for (var i = 0; i < fpsSamples.length; i++) sum += fpsSamples[i];
  fpsAvg = 1000 / (sum / fpsSamples.length);

  acc += elapsed;
  var steps = 0;
  while (acc >= DT && steps < 3) {
    tickCount++;
    applyBuoyancy();
    controlUpdate();
    updateCrateGrab();
    updateRopeGrab();
    updateDrowning();
    updateGrass();
    updateDrips();
    upPressedEdge = false;       // edges consumed once per physics tick
    actionPressedEdge = false;
    Engine.update(engine, DT);   // fixed 60Hz step → deterministic puzzles
    updateCamera();
    acc -= DT;
    steps++;
  }
  if (acc > DT * 3) acc = 0;     // drop debt after long stalls

  render();
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);

/* ============================== invisible debug hook (no UI) ============================== */

window.__LIMBO_DEBUG__ = {
  engine: engine,
  player: player,
  crate: crate,
  wheel1: wheel1,
  wheel2: wheel2,
  plank: plank,
  cartDeck: cartDeck,
  logs: logs,
  ropeSegments: ropeSegments,
  ropes: ROPES,
  cam: cam,
  get ropeIdx() { return ropeGrab.idx; },
  get progressX() { return progressX; },
  get grassDisturbed() { return disturbed.length; },
  get dripCount() { return drips.length; },
  get fps() { return fpsAvg; },
  get tick() { return tickCount; },
  get grounded() { return isGrounded(); },
  get grabbingCrate() { return !!grabConstraint; },
  get onRope() { return !!ropeGrab.constraint; },
  get waterBodies() { return waterBodies.map(function (e) { return e.body.label; }); },
  get submerged() { return playerSubmergedFrac(); },
  get darkSway() { return darkSwayProbe; },
  get drown() { return { ticks: drown.ticks, phase: drown.phase, fade: drown.fade, flail: drown.flail, sink: drown.sink }; },
  get audioState() { return audio.ctx ? audio.ctx.state : 'none'; },
  surfaceAt: surfaceAt,
  pools: WATERS.map(function (p) { return { x0: p.x0, x1: p.x1, surfaceY: p.surfaceY }; }),
  layers: layers.map(function (l) { return l.factor; }),
  view: function () {
    return { camX: cam.x, camY: cam.y, zoom: zoom, cssW: cssW, cssH: cssH,
             viewW: viewW, viewH: viewH };
  }
};
window.__LIMBO_READY__ = true;
}

/* ============================== resilient loader ==============================
   Boots once Matter.js is available. Survives async script injection (e.g. HTML
   preview proxies) and falls back to a second CDN if the first one is blocked. */
(function () {
  var tries = 0, fallbackInjected = false, errorShown = false;
  function attempt() {
    if (typeof Matter !== 'undefined') {
      if (errorShown) document.getElementById('loaderr').style.display = 'none';
      __bootPenumbra();
      return;
    }
    tries++;
    if (tries === 25 && !fallbackInjected) {   // ~2.5s: try the fallback CDN
      fallbackInjected = true;
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/matter-js@0.20.0/build/matter.min.js';
      document.body.appendChild(s);
    }
    if (tries === 150 && !errorShown) {        // ~15s: surface the problem, keep waiting
      errorShown = true;
      document.getElementById('loaderr').style.display = 'block';
    }
    if (tries < 600) setTimeout(attempt, 100);
  }
  attempt();
})();
</script>

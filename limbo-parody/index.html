<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PENUMBRA — a parody homage (Iteration 1)</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas { display: block; background: #000; }
  #loaderr {
    display: none;
    position: fixed; left: 0; right: 0; top: 46%;
    text-align: center;
    color: #555; font: 14px monospace;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="loaderr">could not reach the matter.js CDN &mdash; check your internet connection (still retrying&hellip;)</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script>
'use strict';
function __bootPenumbra() {

var Engine = Matter.Engine, Bodies = Matter.Bodies, Body = Matter.Body,
    Composite = Matter.Composite, Constraint = Matter.Constraint, Events = Matter.Events;

/* ============================== constants ============================== */

var VIEW_W = 1280, VIEW_H = 720;          // virtual 16:9 view in world units
var DT = 1000 / 60;                        // fixed physics step
var WORLD_X0 = -300, WORLD_X1 = 6400;
var GROUND_BOTTOM = 1600;

var GRAVITY_Y = 1.4;
var RUN_SPEED = 5.2, RUN_ACCEL = 0.18, AIR_ACCEL = 0.06;
var GRAB_SPEED = 2.2;
var SWIM_SPEED = 2.6, SWIM_ACCEL = 0.05;
var JUMP_V = 9.6, SWIM_JUMP_V = 9.0;
var COYOTE_TICKS = 6;

var WATERS = [
  { x0: 900,  x1: 1500, surfaceY: 920, floorY: 1160 },   // beat 1 pit
  { x0: 5180, x1: 5800, surfaceY: 925, floorY: 1175 }    // second pool (extension)
];

var ROPE_PIN = { x: 3350, y: 412 };
var ROPE_SEGS = 8, ROPE_SEG_LEN = 30, ROPE_SEG_W = 8;

/* seeded rng so jagged silhouettes are identical every run */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================== canvas / letterbox ============================== */

var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var cssW = 0, cssH = 0, dpr = 1, zoom = 1;
var vignetteCanvas = null;
/* half-resolution offscreen for the soft atmospheric stack (pockets, tree bands, rays) */
var bg = { canvas: null, c: null, w: 0, h: 0, scl: 1 };

function resize() {
  var w = window.innerWidth, h = window.innerHeight;
  // largest 16:9 rectangle that fits → black bars come from the page background
  if (w / h > 16 / 9) { cssH = h; cssW = Math.round(h * 16 / 9); }
  else { cssW = w; cssH = Math.round(w * 9 / 16); }
  dpr = Math.min(window.devicePixelRatio || 1, 1920 / cssW);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  zoom = cssW / VIEW_W;
  bg.canvas = document.createElement('canvas');
  bg.w = bg.canvas.width = Math.max(2, Math.round(canvas.width / 2));
  bg.h = bg.canvas.height = Math.max(2, Math.round(canvas.height / 2));
  bg.c = bg.canvas.getContext('2d');
  bg.scl = (dpr * zoom) / 2;
  buildVignette();
}
window.addEventListener('resize', resize);

function buildVignette() {
  vignetteCanvas = document.createElement('canvas');
  vignetteCanvas.width = canvas.width;
  vignetteCanvas.height = canvas.height;
  var vctx = vignetteCanvas.getContext('2d');
  var cx = canvas.width / 2, cy = canvas.height / 2;
  var rOut = Math.sqrt(cx * cx + cy * cy);
  var g = vctx.createRadialGradient(cx, cy * 0.92, rOut * 0.32, cx, cy, rOut * 1.02);
  g.addColorStop(0.0, 'rgba(0,0,0,0)');
  g.addColorStop(0.55, 'rgba(0,0,0,0.18)');
  g.addColorStop(0.8, 'rgba(0,0,0,0.45)');
  g.addColorStop(1.0, 'rgba(0,0,0,0.72)');
  vctx.fillStyle = g;
  vctx.fillRect(0, 0, vignetteCanvas.width, vignetteCanvas.height);
}

/* ============================== film grain ============================== */

var grainTiles = [];
(function buildGrain() {
  for (var i = 0; i < 6; i++) {
    var t = document.createElement('canvas');
    t.width = 256; t.height = 256;
    var tc = t.getContext('2d');
    var img = tc.createImageData(256, 256);
    for (var p = 0; p < img.data.length; p += 4) {
      var v = (Math.random() * 255) | 0;
      img.data[p] = v; img.data[p + 1] = v; img.data[p + 2] = v;
      img.data[p + 3] = 255;
    }
    tc.putImageData(img, 0, 0);
    grainTiles.push(t);
  }
})();

/* ============================== input ============================== */

var keys = { left: false, right: false, up: false, action: false };
var upPressedEdge = false; // single-press latch for jump

function keyFlag(code) {
  switch (code) {
    case 'ArrowLeft': case 'KeyA': return 'left';
    case 'ArrowRight': case 'KeyD': return 'right';
    case 'ArrowUp': case 'KeyW': return 'up';
    case 'KeyX': case 'KeyZ': case 'ControlLeft': case 'ControlRight': return 'action';
  }
  return null;
}
window.addEventListener('keydown', function (e) {
  var f = keyFlag(e.code);
  if (f) {
    if (f === 'up' && !keys.up) upPressedEdge = true;
    keys[f] = true;
    e.preventDefault();
  }
});
window.addEventListener('keyup', function (e) {
  var f = keyFlag(e.code);
  if (f) { keys[f] = false; e.preventDefault(); }
});

/* ============================== physics world ============================== */

var engine = Engine.create({
  positionIterations: 8,
  velocityIterations: 6,
  constraintIterations: 4,
  gravity: { x: 0, y: GRAVITY_Y }
});
var world = engine.world;

/* terrain blocks: x0, x1, top (collider top edge). all extend to GROUND_BOTTOM */
var blocks = [
  { x0: WORLD_X0, x1: 900,  top: 900  },   // start flats
  { x0: 900,  x1: 1500, top: 1160 },        // water pit 1 floor
  { x0: 1500, x1: 2500, top: 900  },        // crate flats
  { x0: 2500, x1: 3200, top: 750  },        // upper ledge
  { x0: 3200, x1: 3580, top: 1020 },        // gap floor (rope above)
  { x0: 3200, x1: 3320, top: 930  },        // recovery step (lower)
  { x0: 3200, x1: 3290, top: 840  },        // recovery step (upper)
  { x0: 3580, x1: 4750, top: 750  },        // landing flats
  { x0: 4750, x1: 4820, top: 830  },        // step down into the hollow
  { x0: 4820, x1: 5180, top: 905  },        // hollow floor, pool-2 left bank
  { x0: 5180, x1: 5800, top: 1175 },        // water pit 2 floor
  { x0: 5800, x1: WORLD_X1, top: 905 }      // final clearing / end
];

var terrainBodies = [];
blocks.forEach(function (b) {
  var w = b.x1 - b.x0, h = GROUND_BOTTOM - b.top;
  var body = Bodies.rectangle(b.x0 + w / 2, b.top + h / 2, w, h, {
    isStatic: true, friction: 0.9, label: 'terrain'
  });
  terrainBodies.push(body);
});
Composite.add(world, terrainBodies);

/* boundary walls */
Composite.add(world, [
  Bodies.rectangle(WORLD_X0 - 40, 600, 80, 2400, { isStatic: true, label: 'wall' }),
  Bodies.rectangle(WORLD_X1 + 40, 600, 80, 2400, { isStatic: true, label: 'wall' })
]);

/* --- the boy: locked-rotation capsule --- */
var player = Bodies.rectangle(440, 830, 28, 60, {
  chamfer: { radius: 13 },
  inertia: Infinity,
  friction: 0.001,
  frictionStatic: 0.002,
  frictionAir: 0.012,
  density: 0.0016,
  label: 'player',
  collisionFilter: { group: -7 }   // never collides with rope segments (same negative group)
});
Composite.add(world, player);

/* --- water sensors (one per pool) + logs --- */
WATERS.forEach(function (pool, pi) {
  var sensor = Bodies.rectangle(
    (pool.x0 + pool.x1) / 2, (pool.surfaceY + pool.floorY) / 2,
    pool.x1 - pool.x0, pool.floorY - pool.surfaceY,
    { isStatic: true, isSensor: true, label: 'water' }
  );
  sensor.plugin.poolIdx = pi;
  pool.sensor = sensor;
  Composite.add(world, sensor);
});

var logs = [];
[{ x: 1060, y: 880 }, { x: 1330, y: 880 }, { x: 5480, y: 895 }].forEach(function (p) {
  var log = Bodies.rectangle(p.x, p.y, 160, 38, {
    chamfer: { radius: 12 },
    density: 0.0012,
    friction: 0.6,
    frictionAir: 0.01,
    label: 'log'
  });
  logs.push(log);
});
Composite.add(world, logs);

/* --- beat 2: heavy crate --- */
var crate = Bodies.rectangle(2240, 850, 84, 84, {
  density: 0.0012,
  friction: 0.18,
  frictionStatic: 0.7,
  frictionAir: 0.005,
  label: 'crate'
});
Composite.add(world, crate);

/* --- beat 3: rope of linked segments pinned to the overhang branch --- */
var ropeSegments = [];
var ropeConstraints = [];
for (var i = 0; i < ROPE_SEGS; i++) {
  var seg = Bodies.rectangle(ROPE_PIN.x, ROPE_PIN.y + 16 + i * (ROPE_SEG_LEN + 2), ROPE_SEG_W, ROPE_SEG_LEN, {
    density: 0.002,
    frictionAir: 0.02,
    label: 'rope',
    collisionFilter: { group: -7 }
  });
  ropeSegments.push(seg);
}
Composite.add(world, ropeSegments);

ropeConstraints.push(Constraint.create({
  pointA: { x: ROPE_PIN.x, y: ROPE_PIN.y },
  bodyB: ropeSegments[0],
  pointB: { x: 0, y: -ROPE_SEG_LEN / 2 },
  length: 2,
  stiffness: 1
}));
for (i = 1; i < ROPE_SEGS; i++) {
  ropeConstraints.push(Constraint.create({
    bodyA: ropeSegments[i - 1],
    pointA: { x: 0, y: ROPE_SEG_LEN / 2 },
    bodyB: ropeSegments[i],
    pointB: { x: 0, y: -ROPE_SEG_LEN / 2 },
    length: 2,
    stiffness: 0.95
  }));
}
Composite.add(world, ropeConstraints);

/* ============================== collision bookkeeping ============================== */

var groundPairs = {};         // pairId -> true while player rests on something
var waterBodies = [];         // entries { body, pool } for bodies inside a water sensor
var lastGroundTick = -999;
var tickCount = 0;

function pairOther(pair, body) {
  return pair.bodyA === body ? pair.bodyB : (pair.bodyB === body ? pair.bodyA : null);
}

function notePlayerPair(pair) {
  var other = pairOther(pair, player);
  if (!other || other.isSensor) return;
  /* grounded only on near-vertical contact normals under the feet —
     wall-slides and corner grazes must not read as grounded */
  var ny = Math.abs(pair.collision.normal.y);
  var supports = pair.collision.supports;
  var isGround = false;
  if (ny > 0.72) {
    for (var s = 0; s < supports.length; s++) {
      if (supports[s] && supports[s].y > player.position.y + 20) {
        isGround = true;
        break;
      }
    }
  }
  if (isGround) groundPairs[pair.id] = true;
  else delete groundPairs[pair.id];   // pair persists but the contact moved to a wall face
}

function noteWaterPair(pair, entering) {
  var sensorBody = null;
  if (pair.bodyA.plugin && pair.bodyA.plugin.poolIdx !== undefined) sensorBody = pair.bodyA;
  else if (pair.bodyB.plugin && pair.bodyB.plugin.poolIdx !== undefined) sensorBody = pair.bodyB;
  if (!sensorBody) return;
  var other = pair.bodyA === sensorBody ? pair.bodyB : pair.bodyA;
  if (other.isStatic) return;
  for (var i = 0; i < waterBodies.length; i++) {
    if (waterBodies[i].body === other) {
      if (!entering) waterBodies.splice(i, 1);
      return;
    }
  }
  if (entering) waterBodies.push({ body: other, pool: WATERS[sensorBody.plugin.poolIdx] });
}

Events.on(engine, 'collisionStart', function (ev) {
  ev.pairs.forEach(function (pair) {
    if (pair.bodyA === player || pair.bodyB === player) notePlayerPair(pair);
    noteWaterPair(pair, true);
  });
});
Events.on(engine, 'collisionActive', function (ev) {
  ev.pairs.forEach(function (pair) {
    if (pair.bodyA === player || pair.bodyB === player) notePlayerPair(pair);
  });
});
Events.on(engine, 'collisionEnd', function (ev) {
  ev.pairs.forEach(function (pair) {
    if (pair.bodyA === player || pair.bodyB === player) delete groundPairs[pair.id];
    noteWaterPair(pair, false);
  });
});

function isGrounded() {
  for (var k in groundPairs) return true;
  return false;
}

/* ============================== water: ripple + buoyancy ============================== */

function surfaceAt(pool, x, t) {
  return pool.surfaceY
    + 4.5 * Math.sin(0.012 * x + 2.1 * t)
    + 2.5 * Math.sin(0.027 * x - 3.3 * t);
}

function applyBuoyancy() {
  var t = tickCount / 60;
  for (var i = 0; i < waterBodies.length; i++) {
    var b = waterBodies[i].body;
    var pool = waterBodies[i].pool;
    var h = b.bounds.max.y - b.bounds.min.y;
    var surf = surfaceAt(pool, b.position.x, t);
    var frac = Math.max(0, Math.min(1, (b.bounds.max.y - surf) / h));
    if (frac <= 0) continue;
    /* logs float high with heavy damping (stable rafts); the boy gets asymmetric
       drag — water resists his sinking but not his upward paddle-hops, so he can
       actually haul himself out over a bank lip */
    var k, dragX, dragY;
    if (b === player) { k = 1.05; dragX = 0.0012; dragY = (b.velocity.y > 0 ? 0.0016 : 0.0001); }
    else { k = 1.6; dragX = 0.0020; dragY = 0.0026; }
    var fy = -engine.gravity.y * engine.gravity.scale * b.mass * k * frac;
    /* anti-gravity buoyancy + water drag */
    Body.applyForce(b, b.position, {
      x: -b.velocity.x * b.mass * dragX * frac,
      y: fy - b.velocity.y * b.mass * dragY * frac
    });
    /* floating debris self-rights: torque toward the nearest horizontal pose */
    if (b !== player) {
      var dev = ((b.angle % Math.PI) + Math.PI * 1.5) % Math.PI - Math.PI / 2;
      Body.setAngularVelocity(b, b.angularVelocity * 0.92 - dev * 0.012 * frac);
    }
  }
}

function playerSubmergedFrac() {
  for (var i = 0; i < waterBodies.length; i++) {
    if (waterBodies[i].body === player) {
      var h = player.bounds.max.y - player.bounds.min.y;
      var surf = surfaceAt(waterBodies[i].pool, player.position.x, tickCount / 60);
      return Math.max(0, Math.min(1, (player.bounds.max.y - surf) / h));
    }
  }
  return 0;
}

/* ============================== beat 2: crate grab ============================== */

var grabConstraint = null;

function crateInReach() {
  var dx = crate.position.x - player.position.x;
  var dy = crate.position.y - player.position.y;
  return Math.abs(dx) < 100 && Math.abs(dy) < 75;
}

function updateCrateGrab() {
  if (grabConstraint) {
    var dx = crate.position.x - player.position.x;
    var dy = crate.position.y - player.position.y;
    if (!keys.action || Math.abs(dx) > 170 || Math.abs(dy) > 130) {
      Composite.remove(world, grabConstraint);
      grabConstraint = null;
    }
    return;
  }
  if (keys.action && crateInReach() && !ropeGrab.constraint) {
    var side = player.position.x < crate.position.x ? -1 : 1;  // crate face toward player
    var pA = { x: side === -1 ? 14 : -14, y: 0 };
    var pB = { x: side * 42, y: Math.max(-30, Math.min(30, player.position.y - crate.position.y)) };
    var wA = { x: player.position.x + pA.x, y: player.position.y + pA.y };
    var wB = { x: crate.position.x + pB.x, y: crate.position.y + pB.y };
    var len = Math.max(8, Math.hypot(wA.x - wB.x, wA.y - wB.y));
    grabConstraint = Constraint.create({
      bodyA: player, pointA: pA,
      bodyB: crate, pointB: pB,
      length: len, stiffness: 0.2, damping: 0.05
    });
    Composite.add(world, grabConstraint);
  }
}

/* ============================== beat 3: rope grab / swing ============================== */

var ropeGrab = { constraint: null, segment: null, cooldown: 0 };

function updateRopeGrab() {
  if (ropeGrab.cooldown > 0) ropeGrab.cooldown--;

  if (ropeGrab.constraint) {
    /* pump the swing with left / right */
    var dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir !== 0) {
      Body.applyForce(player, player.position, { x: dir * player.mass * 0.0007, y: 0 });
    }
    /* up releases with a small launch boost */
    if (upPressedEdge) {
      Composite.remove(world, ropeGrab.constraint);
      ropeGrab.constraint = null;
      ropeGrab.segment = null;
      ropeGrab.cooldown = 30;
      Body.setVelocity(player, {
        x: player.velocity.x * 1.35,
        y: player.velocity.y - 5.5
      });
      upPressedEdge = false;
    }
    return;
  }

  if (ropeGrab.cooldown > 0 || isGrounded() || grabConstraint) return;
  var handX = player.position.x, handY = player.position.y - 22;
  for (var i = 1; i < ropeSegments.length; i++) {
    var seg = ropeSegments[i];
    if (Math.hypot(seg.position.x - handX, seg.position.y - handY) < 50) {
      ropeGrab.constraint = Constraint.create({
        bodyA: player, pointA: { x: 0, y: -22 },
        bodyB: seg, pointB: { x: 0, y: 0 },
        length: 6, stiffness: 0.2, damping: 0.05
      });
      ropeGrab.segment = seg;
      Composite.add(world, ropeGrab.constraint);
      break;
    }
  }
}

/* ============================== boy control ============================== */

var facing = 1;
var walkPhase = 0;

function controlUpdate() {
  var grounded = isGrounded();
  if (grounded) lastGroundTick = tickCount;
  var coyote = (tickCount - lastGroundTick) <= COYOTE_TICKS;
  var swim = playerSubmergedFrac();
  var onRope = !!ropeGrab.constraint;

  var dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (dir !== 0) facing = dir;

  if (!onRope) {
    var maxSpeed = grabConstraint ? GRAB_SPEED : (swim > 0.25 ? SWIM_SPEED : RUN_SPEED);
    var accel = swim > 0.25 ? SWIM_ACCEL : (grounded ? RUN_ACCEL : AIR_ACCEL);
    var targetVx = dir * maxSpeed;
    var vx = player.velocity.x + (targetVx - player.velocity.x) * accel;
    Body.setVelocity(player, { x: vx, y: player.velocity.y });

    if (upPressedEdge) {
      /* forgiving gate: even shallow immersion allows a paddle-hop out of the water */
      if (swim > 0.15 && player.velocity.y > -2) {
        Body.setVelocity(player, { x: player.velocity.x, y: -SWIM_JUMP_V });
        lastGroundTick = -999;
      } else if (coyote) {
        Body.setVelocity(player, { x: player.velocity.x, y: -JUMP_V });
        lastGroundTick = -999;
        groundPairs = {};
      }
      upPressedEdge = false;
    }
  }

  if (grounded) walkPhase += Math.abs(player.velocity.x) * 0.105;
}

/* ============================== camera ============================== */

var cam = { x: 440, y: 760, anchorX: 440, leadVel: 0 };

function updateCamera() {
  /* horizontal deadzone: anchor follows only when the boy escapes ±90px */
  cam.anchorX = Math.max(cam.anchorX, player.position.x - 90);
  cam.anchorX = Math.min(cam.anchorX, player.position.x + 90);
  /* push ahead of the velocity vector when running — low-passed so the camera
     first trails his acceleration, then drifts out in front */
  cam.leadVel += (player.velocity.x - cam.leadVel) * 0.018;
  var lead = Math.max(-220, Math.min(220, cam.leadVel * 42));
  var tx = cam.anchorX + lead;
  /* lower-third framing: the boy sits at 66% of view height */
  var ty = player.position.y - 0.16 * VIEW_H;

  tx = Math.max(WORLD_X0 + VIEW_W / 2, Math.min(WORLD_X1 - VIEW_W / 2, tx));
  ty = Math.max(380, Math.min(800, ty));

  cam.x += (tx - cam.x) * 0.08;
  cam.y += (ty - cam.y) * 0.045;
}

/* ============================== parallax layers (pre-rendered) ============================== */

var TILE_W = 2400, TILE_H = 900;
var layers = [];   // { tile, factor, alpha }

function makeTile(draw) {
  var t = document.createElement('canvas');
  t.width = TILE_W; t.height = TILE_H;
  var c = t.getContext('2d');
  draw(c);
  return t;
}

function hillPath(c, baseY, amps, phases, freqs) {
  c.beginPath();
  c.moveTo(0, TILE_H);
  for (var x = 0; x <= TILE_W; x += 8) {
    var y = baseY;
    for (var i = 0; i < amps.length; i++) {
      y += amps[i] * Math.sin(Math.PI * 2 * freqs[i] * x / TILE_W + phases[i]);
    }
    c.lineTo(x, y);
  }
  c.lineTo(TILE_W, TILE_H);
  c.closePath();
  c.fill();
}

function bareTree(c, x, baseY, h, lean, rnd, depth) {
  var topX = x + lean * h;
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(x, baseY);
  c.quadraticCurveTo(x + lean * h * 0.4, baseY - h * 0.55, topX, baseY - h);
  c.lineWidth = Math.max(2, h * 0.045);
  c.stroke();
  var nb = 2 + Math.floor(rnd() * 3);
  for (var i = 0; i < nb; i++) {
    var f = 0.45 + rnd() * 0.5;
    var bx = x + lean * h * f * 0.7;
    var by = baseY - h * f;
    var dir = rnd() < 0.5 ? -1 : 1;
    var bl = h * (0.18 + rnd() * 0.22);
    c.beginPath();
    c.moveTo(bx, by);
    c.quadraticCurveTo(bx + dir * bl * 0.6, by - bl * 0.5, bx + dir * bl, by - bl * (0.55 + rnd() * 0.4));
    c.lineWidth = Math.max(1.5, h * 0.02);
    c.stroke();
    if (depth > 1 && rnd() < 0.8) {
      var tx2 = bx + dir * bl, ty2 = by - bl * 0.7;
      c.beginPath();
      c.moveTo(tx2, ty2);
      c.lineTo(tx2 + dir * bl * 0.5, ty2 - bl * 0.5);
      c.lineWidth = Math.max(1, h * 0.012);
      c.stroke();
    }
  }
}

(function buildLayers() {
  /* far hills + spindly distant trees — lightest gray, softened with blur */
  var rnd1 = mulberry32(101);
  layers.push({
    factor: 0.2, alpha: 0.55,
    tile: makeTile(function (c) {
      c.filter = 'blur(3px)';
      c.fillStyle = '#999999'; c.strokeStyle = '#999999';

  /* mid ridge + big organic trees — soft gray masses in the fog */
  var rnd2 = mulberry32(202);

/* jagged top edges (small) + a fringe of individual grass blades on walkable tops */
var terrainPaths = [];
(function buildTerrainPaths() {
  var rnd = mulberry32(777);
  blocks.forEach(function (b) {
    var pts = [];
    for (var x = b.x0; x <= b.x1; x += 14) {
      pts.push({ x: x, y: b.top - rnd() * 3 });
    }
    pts.push({ x: b.x1, y: b.top });
    var blades = [];
    if (b.top <= 1000) {            // no grass on submerged / chasm floors
      for (x = b.x0 + 3; x < b.x1 - 2; x += 4 + rnd() * 9) {
        if (rnd() < 0.22) { x += 14 + rnd() * 26; continue; }      // bald patches
        var clump = 1 + Math.floor(rnd() * 3);                     // clumpy growth
        for (var ci = 0; ci < clump; ci++) {
          var tall = rnd() < 0.07;
          blades.push({ x: x + ci * (1.5 + rnd() * 2.5),
                        h: tall ? 20 + rnd() * 12 : 4 + rnd() * 13,
                        lean: (rnd() - 0.5) * (tall ? 16 : 10) });
        }
      }
    }
    terrainPaths.push({ block: b, pts: pts, blades: blades });
  });
})();

/* grass fringe, drawn per frame with a soft wind shear */
function drawGrass(c) {
  var t = tickCount / 60;
  var x0 = cam.x - VIEW_W / 2 - 40, x1 = cam.x + VIEW_W / 2 + 40;
  c.strokeStyle = '#000000';
  c.lineWidth = 1.7;
  c.lineCap = 'round';
  c.beginPath();
  for (var i = 0; i < terrainPaths.length; i++) {
    var tp = terrainPaths[i];
    if (tp.block.x1 < x0 || tp.block.x0 > x1) continue;
    for (var j = 0; j < tp.blades.length; j++) {
      var bl = tp.blades[j];
      if (bl.x < x0 || bl.x > x1) continue;
      var shear = Math.sin(t * 1.4 + bl.x * 0.06) * 1.8 * (bl.h / 14);
      c.moveTo(bl.x, tp.block.top + 1);
      c.lineTo(bl.x + bl.lean + shear, tp.block.top - bl.h);
    }
  }
  c.stroke();
}

/* ============================== organic tree generator & eerie set dressing ==============================
   Geometry is generated once per tree (seeded, deterministic); sway is applied at
   draw time by displacing spine/branch points, so animation costs almost nothing. */

function genTree(seed, h, baseW, foliage) {
  var rnd = mulberry32(seed);
  var SEGS = 8;
  var g = { h: h, spine: [], widths: [], branches: [], blobs: [],
            swayFreq: 0.22 + rnd() * 0.28, swayPhase: rnd() * 6.283 };
  var x = 0, drift = (rnd() - 0.5) * 0.1;
  for (var i = 0; i <= SEGS; i++) {
    var f = i / SEGS;
    g.spine.push({ x: x, y: -h * f });
    x += (rnd() - 0.5) * h * 0.045 + drift * h * 0.1;          // wander + lean
    var w = Math.max(baseW * Math.pow(1 - f, 1.2) + baseW * 0.05, baseW * 0.18);
    if (i === 0) w = baseW * 1.8;                               // root flare
    else if (i === 1) w = baseW * 1.12;
    g.widths.push(w);
  }
  var nb = 3 + Math.floor(rnd() * 3);
  for (var b = 0; b < nb; b++) {
    var k = 3 + Math.floor(rnd() * (SEGS - 3));
    var dir = rnd() < 0.5 ? -1 : 1;
    var bl = h * (0.18 + rnd() * 0.3);
    var ang = -0.45 - rnd() * 0.55;                             // start upward-outward
    var BS = 4, bx = 0, by = 0;
    var pts = [{ x: 0, y: 0 }];
    var bw0 = Math.max(2.2, g.widths[Math.min(k, SEGS)] * 0.32);  // slender, not club-like
    var widths = [bw0], thorns = [];
    for (var s = 1; s <= BS; s++) {
      ang += (rnd() - 0.38) * 0.5;                              // curve up, then droop
      bx += Math.cos(ang) * (bl / BS) * dir;
      by += Math.sin(ang) * (bl / BS);
      pts.push({ x: bx, y: by });
      widths.push(Math.max(1, bw0 * (1 - s / (BS + 0.25))));    // taper to a point
      /* thorn spikes along the branch — the jagged Limbo silhouette */
      var roll = rnd();
      var nt = roll < 0.2 ? 0 : (roll < 0.75 ? 1 : 2);
      for (var q = 0; q < nt; q++) {
        var tf = rnd();
        var hx = pts[s - 1].x + (bx - pts[s - 1].x) * tf;
        var hy = pts[s - 1].y + (by - pts[s - 1].y) * tf;
        var ta = ang + (rnd() < 0.5 ? -1 : 1) * (0.85 + rnd() * 0.75);
        var tl = 3 + rnd() * 19;
        thorns.push({ x0: hx, y0: hy, x1: hx + Math.cos(ta) * tl * dir, y1: hy + Math.sin(ta) * tl, seg: s });
      }
    }
    for (q = 0; q < 2; q++) {                                   // frayed tip
      var fa = ang + (rnd() - 0.5) * 1.5;
      thorns.push({ x0: bx, y0: by, x1: bx + Math.cos(fa) * (9 + rnd() * 13) * dir, y1: by + Math.sin(fa) * (9 + rnd() * 13), seg: BS });
    }
    g.branches.push({ k: k, pts: pts, widths: widths, thorns: thorns,
                      freq: 0.35 + rnd() * 0.45, phase: rnd() * 6.283 });
  }
  if (foliage) {
    /* dense leafy canopy: a solid core with tightly overlapping discs (no bubble gaps) */
    var top = g.spine[SEGS];
    g.blobs.push({ x: top.x, y: top.y - h * 0.04, r: h * 0.21 });
    var nBlob = 16 + Math.floor(rnd() * 6);
    for (i = 0; i < nBlob; i++) {
      var a2 = rnd() * 6.283, rr = Math.sqrt(rnd()) * h * 0.17;
      g.blobs.push({ x: top.x + Math.cos(a2) * rr * 1.6, y: top.y + Math.sin(a2) * rr * 0.62 - h * 0.04,
                     r: h * (0.10 + rnd() * 0.07) });
    }
    for (b = 0; b < g.branches.length; b++) {
      var br2 = g.branches[b], tip = br2.pts[br2.pts.length - 1], at = g.spine[br2.k];
      g.blobs.push({ x: at.x + tip.x * 0.55, y: at.y + tip.y * 0.55 - h * 0.04, r: h * (0.12 + rnd() * 0.05) });
    }
  }
  return g;
}

function drawTreeGeom(c, g, x, baseY, t, swayAmp, lowDetail) {
  var SEGS = g.spine.length - 1;
  var sway = Math.sin(t * g.swayFreq + g.swayPhase) * swayAmp;
  var i, f;
  /* smooth trunk outline: quadratics through segment midpoints (no faceting) */
  var L = [], R = [];
  for (i = 0; i <= SEGS; i++) {
    f = i / SEGS;
    var cxx = x + g.spine[i].x + sway * f * f;
    var cy = baseY + g.spine[i].y;
    L.push({ x: cxx - g.widths[i] / 2, y: cy });
    R.push({ x: cxx + g.widths[i] / 2, y: cy });
  }
  c.beginPath();
  c.moveTo(L[0].x, L[0].y);
  for (i = 1; i < SEGS; i++) c.quadraticCurveTo(L[i].x, L[i].y, (L[i].x + L[i + 1].x) / 2, (L[i].y + L[i + 1].y) / 2);
  c.lineTo(L[SEGS].x, L[SEGS].y);
  c.lineTo(R[SEGS].x, R[SEGS].y);
  for (i = SEGS - 1; i > 0; i--) c.quadraticCurveTo(R[i].x, R[i].y, (R[i].x + R[i - 1].x) / 2, (R[i].y + R[i - 1].y) / 2);
  c.lineTo(R[0].x, R[0].y);
  c.closePath();
  c.fill();
  c.lineCap = 'round';
  for (var b = 0; b < g.branches.length; b++) {
    var br = g.branches[b];
    var fk = br.k / SEGS;
    var bx = x + g.spine[br.k].x + sway * fk * fk;
    var by = baseY + g.spine[br.k].y;
    var bsway = sway * 0.6 + Math.sin(t * br.freq + br.phase) * swayAmp * 0.55;
    var n = br.pts.length - 1;
    if (lowDetail) {
      /* one tapered-ish polyline per branch keeps band rendering cheap */
      c.lineWidth = Math.max(1.2, br.widths[1] * 0.85);
      c.beginPath();
      c.moveTo(bx + br.pts[0].x, by + br.pts[0].y);
      for (var s0 = 1; s0 <= n; s0++) {
        c.lineTo(bx + br.pts[s0].x + bsway * Math.pow(s0 / n, 2), by + br.pts[s0].y);
      }
      c.stroke();
    } else {
      for (var s = 0; s < n; s++) {
        var o1 = bsway * Math.pow(s / n, 2), o2 = bsway * Math.pow((s + 1) / n, 2);
        c.lineWidth = Math.max(1.2, br.widths[s]);
        c.beginPath();
        c.moveTo(bx + br.pts[s].x + o1, by + br.pts[s].y);
        c.lineTo(bx + br.pts[s + 1].x + o2, by + br.pts[s + 1].y);
        c.stroke();
      }
    }
    c.lineWidth = 1.7;
    c.beginPath();
    for (var q = 0; q < br.thorns.length; q++) {
      var th = br.thorns[q];
      var of = bsway * Math.pow(th.seg / n, 2);
      c.moveTo(bx + th.x0 + of, by + th.y0);
      c.lineTo(bx + th.x1 + of * 1.15, by + th.y1);
    }
    c.stroke();
  }
  if (g.blobs.length) {
    c.beginPath();
    for (i = 0; i < g.blobs.length; i++) {
      var bl2 = g.blobs[i];
      c.moveTo(x + bl2.x + sway + bl2.r, baseY + bl2.y);
      c.arc(x + bl2.x + sway, baseY + bl2.y, bl2.r, 0, 6.283);
    }
    c.fill();
  }
  return sway;
}

/* world position of a branch tip (for hanging cocoons) */
function treeBranchTip(g, x, baseY, t, swayAmp) {
  var SEGS = g.spine.length - 1;
  var sway = Math.sin(t * g.swayFreq + g.swayPhase) * swayAmp;
  var br = g.branches[0];
  var fk = br.k / SEGS;
  var tip = br.pts[br.pts.length - 1];
  var bsway = sway * 0.6 + Math.sin(t * br.freq + br.phase) * swayAmp * 0.55;
  return {
    x: x + g.spine[br.k].x + sway * fk * fk + tip.x + bsway,
    y: baseY + g.spine[br.k].y + tip.y
  };
}

/* a wrapped bundle swinging slowly on a thread — drawn in the current fill color */
function drawCocoon(c, px, py, t, phase, scale) {
  var ang = 0.24 * Math.sin(t * 0.55 + phase);
  var threadLen = 74 * scale;
  var cx = px + Math.sin(ang) * threadLen;
  var cy = py + Math.cos(ang) * threadLen;
  c.lineWidth = 2.2;
  c.beginPath(); c.moveTo(px, py); c.lineTo(cx, cy); c.stroke();
  c.save();
  c.translate(cx, cy);
  c.rotate(ang * 0.7);
  c.beginPath();
  c.moveTo(0, 0);
  c.bezierCurveTo(-9 * scale, 8 * scale, -8.5 * scale, 30 * scale, 0, 38 * scale);
  c.bezierCurveTo(8.5 * scale, 30 * scale, 9 * scale, 8 * scale, 0, 0);
  c.closePath();
  c.fill();
  c.restore();
}

/* --- high swaying vines with ragged tufts at the tip --- */

  { x: 5950, tipY: 600, phase: 4.1 }

worldVines.forEach(function (v, i) {

  v.tuft = [];
  for (var q = 0; q < 5; q++) {
    var a = 1.05 + rnd() * 1.05;          // fan downward-outward
    var l = 8 + rnd() * 12;

function drawWorldTrees(c) {
  var t = tickCount / 60;
  c.fillStyle = '#000000';
  c.strokeStyle = '#000000';
  for (var i = 0; i < worldTrees.length; i++) {
    var tr = worldTrees[i];
    drawTreeGeom(c, tr.geom, tr.x, tr.baseY, t, 5);
    if (tr.cocoon) {
      var tip = treeBranchTip(tr.geom, tr.x, tr.baseY, t, 5);
      drawCocoon(c, tip.x, tip.y, t, tr.seed, 1);
    }
    if (tr.tuftVine) {
      /* ragged root dangling from a branch, swinging slowly (ref: Limbo forest) */
      var bt = treeBranchTip(tr.geom, tr.x, tr.baseY, t, 5);
      var hang = 110, vs = Math.sin(t * 0.45 + tr.seed) * 9;
      c.lineWidth = 2.6;
      c.beginPath();
      c.moveTo(bt.x, bt.y);
      c.quadraticCurveTo(bt.x + vs * 0.5, bt.y + hang * 0.55, bt.x + vs, bt.y + hang);
      c.stroke();
      c.lineWidth = 1.8;
      c.beginPath();
      for (var q2 = 0; q2 < 5; q2++) {
        var ta2 = 0.95 + q2 * 0.32;
        c.moveTo(bt.x + vs, bt.y + hang);
        c.lineTo(bt.x + vs + Math.cos(ta2) * (16 - q2 * 2) * (q2 % 2 ? -1 : 1),
                 bt.y + hang + Math.sin(ta2) * (15 - q2 * 1.5));
      }
      c.stroke();
    }
  }
  c.lineCap = 'round';
  for (i = 0; i < worldVines.length; i++) {
    var v = worldVines[i];
    var sway = Math.sin(t * 0.5 + v.phase) * 20;
    var sway2 = Math.sin(t * 0.5 + v.phase + 0.8) * 12;
    c.lineWidth = 4.5;
    c.beginPath();
    c.moveTo(v.x, 60);
    c.quadraticCurveTo(v.x + sway2, (60 + v.tipY) * 0.55, v.x + sway, v.tipY);
    c.stroke();
    c.lineWidth = 2;
    c.beginPath();
    for (var q = 0; q < v.tuft.length; q++) {
      c.moveTo(v.x + sway, v.tipY);
      c.lineTo(v.x + sway + v.tuft[q].x + sway * 0.08, v.tipY + v.tuft[q].y);
    }
    c.stroke();
  }
}

/* --- animated parallax tree bands, geometry cached per slot --- */
var darkSwayProbe = 0;   // read by the eval harness to prove the animation is live
var bandCache = {};

var TREE_BANDS = [
  { id: 'mid',  factor: 0.68, color: '#333333', alpha: 0.85, spacing: 640, seedBase: 5000,
    baseV: 330, hMin: 420, hVar: 300, wMin: 46, wVar: 44, swayAmp: 4, cocoonChance: 0.12, giantEvery: 0 },
  { id: 'near', factor: 0.85, color: '#141414', alpha: 0.92, spacing: 560, seedBase: 9000,
    baseV: 345, hMin: 400, hVar: 300, wMin: 34, wVar: 40, swayAmp: 5, cocoonChance: 0.25, giantEvery: 5 }
];

function drawTreeBand(band, probe) {
  var c = bg.c;
  var t = tickCount / 60;
  c.setTransform(bg.scl, 0, 0, bg.scl, bg.w / 2, bg.h / 2);
  c.globalAlpha = band.alpha;
  c.fillStyle = band.color;
  c.strokeStyle = band.color;
  var px = cam.x * band.factor;
  var voff = Math.max(-60, Math.min(60, -(cam.y - 760) * band.factor * 0.35));
  var k0 = Math.floor((px - 900) / band.spacing), k1 = Math.ceil((px + 900) / band.spacing);
  if (probe) darkSwayProbe = 0;
  for (var k = k0; k <= k1; k++) {
    var key = band.id + ':' + k;
    var slot = bandCache[key];
    if (!slot) {
      var rnd = mulberry32(band.seedBase + k * 911);
      var giant = band.giantEvery > 0 && ((k % band.giantEvery) + band.giantEvery) % band.giantEvery === 0;
      slot = bandCache[key] = {
        jit: (rnd() - 0.5) * band.spacing * 0.4,
        geom: genTree(band.seedBase + k * 13 + 7,
                      giant ? 780 + rnd() * 180 : band.hMin + rnd() * band.hVar,
                      giant ? 100 + rnd() * 44 : band.wMin + rnd() * band.wVar,
                      false),
        cocoon: rnd() < band.cocoonChance,
        seed: k
      };
    }
    var tx = k * band.spacing + slot.jit - px;
    if (tx < -1000 || tx > 1000) continue;
    var sway = drawTreeGeom(c, slot.geom, tx, band.baseV + voff, t, band.swayAmp, true);
    if (probe) darkSwayProbe += sway;
    if (slot.cocoon) {
      var tip = treeBranchTip(slot.geom, tx, band.baseV + voff, t, band.swayAmp);
      drawCocoon(c, tip.x, tip.y, t, slot.seed, 0.8);
    }
  }
  c.globalAlpha = 1;
}

/* --- bright fog pockets glowing behind the tree silhouettes --- */
var pocketCache = {};
function drawGlowPockets() {
  var c = bg.c;
  var t = tickCount / 60;
  c.setTransform(bg.scl, 0, 0, bg.scl, bg.w / 2, bg.h / 2);
  var px = cam.x * 0.3;
  var k0 = Math.floor((px - 1100) / 760), k1 = Math.ceil((px + 1100) / 760);
  for (var k = k0; k <= k1; k++) {
    var p = pocketCache[k];
    if (!p) {
      var rnd = mulberry32(31 + k * 197);
      p = pocketCache[k] = { jit: (rnd() - 0.5) * 300, gy: -160 + rnd() * 300,
                             r: 280 + rnd() * 200, a: 0.17 + rnd() * 0.11, ph: rnd() * 6.283 };
    }
    var gx = k * 760 + p.jit - px;
    c.globalAlpha = p.a * (0.82 + 0.18 * Math.sin(t * 0.17 + p.ph));
    c.drawImage(glowSprite, gx - p.r, p.gy - p.r, p.r * 2, p.r * 2);
  }
  c.globalAlpha = 1;
}

/* --- diagonal god rays drifting through the fog --- */
var rayCache = {};
function drawGodRays() {
  var c = bg.c;
  var t = tickCount / 60;
  var px = cam.x * 0.22;
  var k0 = Math.floor((px - 1000) / 540), k1 = Math.ceil((px + 1000) / 540);
  for (var k = k0; k <= k1; k++) {
    var r = rayCache[k];
    if (!r) {
      var rnd = mulberry32(401 + k * 53);
      r = rayCache[k] = { skip: rnd() < 0.3, jit: (rnd() - 0.5) * 260, w: 110 + rnd() * 160,
                          ang: 0.40 + rnd() * 0.14, a: 0.20 + rnd() * 0.12, ph: rnd() * 6.283 };
    }
    if (r.skip) continue;
    var topX = k * 540 + r.jit - px;
    c.setTransform(bg.scl, 0, 0, bg.scl, bg.w / 2, bg.h / 2);
    c.translate(topX, -390);
    c.rotate(r.ang);                                  // lean: upper-right → lower-left
    c.globalAlpha = r.a * (0.8 + 0.2 * Math.sin(t * 0.13 + r.ph));
    c.drawImage(raySprite, -r.w / 2, 0, r.w, 1060);
  }
  c.globalAlpha = 1;
}

/* ============================== boy rendering ============================== */

var blinkUntil = 0, nextBlink = 180;

function drawBoy(c) {
  var p = player.position;
  var vx = player.velocity.x, vy = player.velocity.y;
  var grounded = isGrounded();
  var onRope = !!ropeGrab.constraint;
  var swim = playerSubmergedFrac();
  var t = tickCount / 60;

  var speed = Math.abs(vx);
  var running = grounded && speed > 0.6;
  var lean = Math.max(-0.22, Math.min(0.22, vx * 0.035));
  var bob = running ? Math.abs(Math.sin(walkPhase)) * 2.2 : Math.sin(t * 2.1) * 0.8;

  c.save();
  c.translate(p.x, p.y);
  c.fillStyle = '#000000';
  c.strokeStyle = '#000000';
  c.lineCap = 'round';

  var hipY = 10;
  var shoulderY = -14;

  /* legs */
  c.lineWidth = 7.5;
  if (onRope) {
    var sway = Math.sin(t * 2.4) * 3;
    c.beginPath(); c.moveTo(-3, hipY);
    c.quadraticCurveTo(-6 + sway, hipY + 11, -4 + sway, hipY + 20); c.stroke();
    c.beginPath(); c.moveTo(3, hipY);
    c.quadraticCurveTo(7 + sway, hipY + 10, 5 + sway, hipY + 19); c.stroke();
  } else if (!grounded && swim < 0.2) {
    /* jump tuck */
    c.beginPath(); c.moveTo(-3, hipY);
    c.quadraticCurveTo(-9, hipY + 7, -8 + facing * 3, hipY + (vy < 0 ? 11 : 16)); c.stroke();
    c.beginPath(); c.moveTo(3, hipY);
    c.quadraticCurveTo(8, hipY + 9, 4 + facing * 4, hipY + (vy < 0 ? 13 : 18)); c.stroke();
  } else if (running) {
    var s1 = Math.sin(walkPhase), s2 = Math.sin(walkPhase + Math.PI);
    c.beginPath(); c.moveTo(-2, hipY);
    c.quadraticCurveTo(s1 * 6 + facing * 2, hipY + 9, s1 * 11, hipY + 20 - Math.max(0, Math.cos(walkPhase)) * 4.5); c.stroke();
    c.beginPath(); c.moveTo(2, hipY);
    c.quadraticCurveTo(s2 * 6 + facing * 2, hipY + 9, s2 * 11, hipY + 20 - Math.max(0, Math.cos(walkPhase + Math.PI)) * 4.5); c.stroke();
  } else {
    c.beginPath(); c.moveTo(-3, hipY); c.lineTo(-4.5, hipY + 20); c.stroke();
    c.beginPath(); c.moveTo(3, hipY); c.lineTo(4.5, hipY + 20); c.stroke();
  }

  /* torso */
  c.save();
  c.rotate(lean);
  c.beginPath();
  c.roundRect(-9, shoulderY - 9 - bob * 0.4, 18, 32 + bob * 0.4, 8);
  c.fill();
  c.restore();

  /* arms */
  c.lineWidth = 5.5;
  if (onRope && ropeGrab.segment) {
    var seg = ropeGrab.segment.position;
    var ax = seg.x - p.x, ay = seg.y - p.y;
    c.beginPath(); c.moveTo(-4, shoulderY - bob * 0.3); c.quadraticCurveTo(ax * 0.4 - 4, ay * 0.55, ax - 2.5, ay + 2); c.stroke();
    c.beginPath(); c.moveTo(4, shoulderY - bob * 0.3); c.quadraticCurveTo(ax * 0.4 + 4, ay * 0.55, ax + 2.5, ay + 2); c.stroke();
  } else if (grabConstraint) {
    var cdir = crate.position.x > p.x ? 1 : -1;
    c.beginPath(); c.moveTo(-3, shoulderY + 1); c.quadraticCurveTo(cdir * 8, shoulderY + 4, cdir * 16, shoulderY + 7); c.stroke();
    c.beginPath(); c.moveTo(3, shoulderY + 1); c.quadraticCurveTo(cdir * 9, shoulderY + 6, cdir * 16, shoulderY + 10); c.stroke();
  } else if (!grounded && swim < 0.2) {
    c.beginPath(); c.moveTo(-4, shoulderY); c.quadraticCurveTo(-11, shoulderY + 2, -13, shoulderY - 6); c.stroke();
    c.beginPath(); c.moveTo(4, shoulderY); c.quadraticCurveTo(11, shoulderY + 3, 12, shoulderY - 4); c.stroke();
  } else if (running) {
    var a1 = Math.sin(walkPhase + Math.PI) * 8, a2 = Math.sin(walkPhase) * 8;
    c.beginPath(); c.moveTo(-3, shoulderY); c.quadraticCurveTo(a1 * 0.5 - 3, shoulderY + 8, a1, shoulderY + 15); c.stroke();
    c.beginPath(); c.moveTo(3, shoulderY); c.quadraticCurveTo(a2 * 0.5 + 3, shoulderY + 8, a2, shoulderY + 15); c.stroke();
  } else {
    c.beginPath(); c.moveTo(-4, shoulderY); c.lineTo(-5.5, shoulderY + 15); c.stroke();
    c.beginPath(); c.moveTo(4, shoulderY); c.lineTo(5.5, shoulderY + 15); c.stroke();
  }

  /* head */
  var headX = facing * 2.8 + lean * 14;
  var headY = shoulderY - 13 - bob;
  c.beginPath();
  c.arc(headX, headY, 10.5, 0, Math.PI * 2);
  c.fill();

  /* the eyes — the only detail on him: two tiny glowing white dots */
  if (tickCount > blinkUntil) {
    if (tickCount > nextBlink) {
      blinkUntil = tickCount + 8;
      nextBlink = tickCount + 170 + Math.floor(Math.random() * 130);
    }
    c.save();
    c.fillStyle = '#ffffff';
    c.shadowColor = '#ffffff';
    c.shadowBlur = 7;
    c.beginPath();
    c.arc(headX + facing * 3.4 - 2.1, headY - 1.5, 1.55, 0, Math.PI * 2);
    c.arc(headX + facing * 3.4 + 2.4, headY - 1.5, 1.55, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }

  c.restore();
}

/* ============================== world rendering ============================== */

function drawTerrain(c) {
  c.fillStyle = '#000000';
  terrainPaths.forEach(function (tp) {
    var b = tp.block;
    c.beginPath();
    c.moveTo(b.x0, GROUND_BOTTOM + 200);
    c.lineTo(b.x0, tp.pts[0].y);
    for (var i = 1; i < tp.pts.length; i++) c.lineTo(tp.pts[i].x, tp.pts[i].y);
    c.lineTo(b.x1, GROUND_BOTTOM + 200);
    c.closePath();
    c.fill();
  });
}

function drawWater(c) {
  var t = tickCount / 60;
  /* dark gray water bodies with sine-rippled top edges */
  c.fillStyle = '#1b1b1b';   // opaque murky dark gray — nothing reads through the depths
  for (var p = 0; p < WATERS.length; p++) {
    var pool = WATERS[p];
    c.beginPath();
    c.moveTo(pool.x0, surfaceAt(pool, pool.x0, t));
    for (var x = pool.x0 + 10; x <= pool.x1; x += 10) c.lineTo(x, surfaceAt(pool, x, t));
    c.lineTo(pool.x1, pool.floorY + 80);
    c.lineTo(pool.x0, pool.floorY + 80);
    c.closePath();
    c.fill();
  }
}

function drawWaterSurface(c) {
  var t = tickCount / 60;
  /* pale surface highlight lines, drawn over the floating logs */
  c.strokeStyle = 'rgba(110,110,110,0.5)';
  c.lineWidth = 2;
  for (var p = 0; p < WATERS.length; p++) {
    var pool = WATERS[p];
    c.beginPath();
    c.moveTo(pool.x0, surfaceAt(pool, pool.x0, t));
    for (var x = pool.x0 + 10; x <= pool.x1; x += 10) c.lineTo(x, surfaceAt(pool, x, t));
    c.stroke();
  }
}

function drawLogs(c) {
  c.fillStyle = '#000000';
  logs.forEach(function (log) {
    c.save();
    c.translate(log.position.x, log.position.y);
    c.rotate(log.angle);
    c.beginPath();
    c.roundRect(-80, -19, 160, 38, 12);
    c.fill();
    /* stubby cut branch on top — silhouette detail */
    c.beginPath();
    c.roundRect(26, -29, 12, 14, 4);
    c.fill();
    c.restore();
  });
}

function drawCrate(c) {
  c.save();
  c.translate(crate.position.x, crate.position.y);
  c.rotate(crate.angle);
  c.fillStyle = '#000000';
  c.beginPath();
  c.rect(-42, -42, 84, 84);
  c.fill();
  /* shape-only notches keep it pure black yet readable as a crate */
  c.beginPath();
  c.rect(-46, -34, 4, 10);
  c.rect(42, 18, 4, 10);
  c.fill();
  c.restore();
}

function drawRope(c) {
  c.strokeStyle = '#000000';
  c.lineCap = 'round';
  c.lineWidth = 6;
  c.beginPath();
  c.moveTo(ROPE_PIN.x, ROPE_PIN.y);
  for (var i = 0; i < ropeSegments.length; i++) {
    c.lineTo(ropeSegments[i].position.x, ropeSegments[i].position.y);
  }
  c.stroke();
  /* knot at the end */
  var last = ropeSegments[ropeSegments.length - 1].position;
  c.fillStyle = '#000000';
  c.beginPath();
  c.arc(last.x, last.y + 12, 7, 0, Math.PI * 2);
  c.fill();
}

function drawEndGlow(c) {
  var t = tickCount / 60;
  for (var i = 0; i < 3; i++) {
    var gx = 6240 + i * 36 + Math.sin(t * 0.9 + i * 2.1) * 14;
    var gy = 800 + Math.sin(t * 1.3 + i * 1.4) * 18 - i * 26;
    var r = 26 + Math.sin(t * 2 + i) * 5;
    var g = c.createRadialGradient(gx, gy, 0, gx, gy, r);
    g.addColorStop(0, 'rgba(255,255,255,0.5)');
    g.addColorStop(0.25, 'rgba(255,255,255,0.12)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g;
    c.beginPath();
    c.arc(gx, gy, r, 0, Math.PI * 2);
    c.fill();
  }
}

/* ============================== frame render ============================== */

var mistDrift = 0;

function render() {
  var W = canvas.width, H = canvas.height;
  var sc = dpr * zoom;
  var bc = bg.c, bw = bg.w, bh = bg.h;

  /* === the entire atmospheric stack renders at half resolution into bg,
     then is upscaled once — cheap on the raster thread, and the soft
     upscale doubles as atmospheric depth blur === */
  bc.setTransform(1, 0, 0, 1, 0, 0);

  /* --- sky: foggy gray gradient + soft glow --- */
  var sky = bc.createLinearGradient(0, 0, 0, bh);
  sky.addColorStop(0, '#8e8e8e');
  sky.addColorStop(0.52, '#b2b2b2');
  sky.addColorStop(1, '#3f3f3f');
  bc.fillStyle = sky;
  bc.fillRect(0, 0, bw, bh);
  var glow = bc.createRadialGradient(bw * 0.5, bh * 0.42, 0, bw * 0.5, bh * 0.42, bw * 0.42);
  glow.addColorStop(0, 'rgba(255,255,255,0.16)');
  glow.addColorStop(1, 'rgba(255,255,255,0)');
  bc.fillStyle = glow;
  bc.fillRect(0, 0, bw, bh);

  /* --- parallax layers, driven by the camera's LERP coordinates --- */
  mistDrift += 0.12;
  for (var li = 0; li < layers.length; li++) {
    var L = layers[li];
    bc.setTransform(bg.scl, 0, 0, bg.scl, bw / 2, bh / 2);
    bc.globalAlpha = L.alpha;
    var px = cam.x * L.factor;
    var voff = Math.max(-60, Math.min(60, -(cam.y - 760) * L.factor * 0.35));
    var k0 = Math.floor((px - VIEW_W / 2) / TILE_W);
    for (var k = k0; k * TILE_W - px < VIEW_W / 2; k++) {
      bc.drawImage(L.tile, k * TILE_W - px, -450 + voff);
    }
    bc.globalAlpha = 1;

    /* drifting mist bands between layers */
    if (li < 2) {
      bc.setTransform(1, 0, 0, 1, 0, 0);
      var mw = bw * 0.7;
      var mx = ((mistDrift * (li + 1) * 0.35) % (bw + mw)) - mw + (li === 0 ? 0 : bw * 0.4);
      var my = bh * (0.45 + li * 0.18);
      bc.globalAlpha = 0.09;
      bc.drawImage(glowSprite, mx, my - mw * 0.18, mw, mw * 0.36);
      bc.globalAlpha = 1;
    }
    if (li === 0) drawGlowPockets();   // bright fog pockets behind the mid/near trees
  }

  drawTreeBand(TREE_BANDS[0], false);
  drawTreeBand(TREE_BANDS[1], true);
  drawGodRays();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg.canvas, 0, 0, W, H);

  /* --- world space: pure black silhouettes --- */
  ctx.setTransform(sc, 0, 0, sc, W / 2 - cam.x * sc, H / 2 - cam.y * sc);
  drawTerrain(ctx);
  drawGrass(ctx);
  drawGallowsTree(ctx);
  drawWorldTrees(ctx);
  drawEndGlow(ctx);
  drawCrate(ctx);
  drawRope(ctx);
  drawWater(ctx);
  drawLogs(ctx);
  drawWaterSurface(ctx);
  drawBoy(ctx);

  /* --- post stack --- */
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(vignetteCanvas, 0, 0);

  /* heavy film grain: 'overlay' keeps pure blacks pure */
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.18;
  var tile = grainTiles[tickCount % grainTiles.length];
  var gs = 256 * 2.5 * dpr;
  var ox = -((Math.random() * 256) | 0), oy = -((Math.random() * 256) | 0);
  for (var gy = oy; gy < H; gy += gs) {
    for (var gx = ox; gx < W; gx += gs) {
      ctx.drawImage(tile, gx, gy, gs, gs);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ============================== main loop: fixed-step physics ============================== */

var acc = 0, lastTs = 0;
var fpsSamples = [], fpsAvg = 60;

function frame(ts) {
  if (lastTs === 0) lastTs = ts;
  var elapsed = Math.min(ts - lastTs, 100);
  lastTs = ts;

  fpsSamples.push(elapsed);
  if (fpsSamples.length > 60) fpsSamples.shift();
  var sum = 0;
  for (var i = 0; i < fpsSamples.length; i++) sum += fpsSamples[i];
  fpsAvg = 1000 / (sum / fpsSamples.length);

  acc += elapsed;
  var steps = 0;
  while (acc >= DT && steps < 3) {
    tickCount++;
    applyBuoyancy();
    controlUpdate();
    updateCrateGrab();
    updateRopeGrab();
    upPressedEdge = false;       // edge consumed once per physics tick
    Engine.update(engine, DT);   // fixed 60Hz step → deterministic puzzles
    updateCamera();
    acc -= DT;
    steps++;
  }
  if (acc > DT * 3) acc = 0;     // drop debt after long stalls

  render();
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);

/* ============================== invisible debug hook (no UI) ============================== */

window.__LIMBO_DEBUG__ = {
  engine: engine,
  player: player,
  crate: crate,
  logs: logs,
  ropeSegments: ropeSegments,
  cam: cam,
  get fps() { return fpsAvg; },
  get tick() { return tickCount; },
  get grounded() { return isGrounded(); },
  get grabbingCrate() { return !!grabConstraint; },
  get onRope() { return !!ropeGrab.constraint; },
  get waterBodies() { return waterBodies.map(function (e) { return e.body.label; }); },
  get submerged() { return playerSubmergedFrac(); },
  get darkSway() { return darkSwayProbe; },
  surfaceAt: surfaceAt,
  pools: WATERS.map(function (p) { return { x0: p.x0, x1: p.x1, surfaceY: p.surfaceY }; }),
  layers: layers.map(function (l) { return l.factor; }),
  view: function () {
    return { camX: cam.x, camY: cam.y, zoom: zoom, cssW: cssW, cssH: cssH };
  }
};
window.__LIMBO_READY__ = true;
}

/* ============================== resilient loader ==============================
   Boots once Matter.js is available. Survives async script injection (e.g. HTML
   preview proxies) and falls back to a second CDN if the first one is blocked. */
(function () {
  var tries = 0, fallbackInjected = false, errorShown = false;
  function attempt() {
    if (typeof Matter !== 'undefined') {
      if (errorShown) document.getElementById('loaderr').style.display = 'none';
      __bootPenumbra();
      return;
    }
    tries++;
    if (tries === 25 && !fallbackInjected) {   // ~2.5s: try the fallback CDN
      fallbackInjected = true;
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/matter-js@0.20.0/build/matter.min.js';
      document.body.appendChild(s);
    }
    if (tries === 150 && !errorShown) {        // ~15s: surface the problem, keep waiting
      errorShown = true;
      document.getElementById('loaderr').style.display = 'block';
    }
    if (tries < 600) setTimeout(attempt, 100);
  }
  attempt();
})();
</script>

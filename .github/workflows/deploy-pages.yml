name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/virtual-phone-gift-6027
      - cursor/bc-5fd2158d-847b-44d3-b77f-90ba063719c5-2695
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p dist
          cp -R index.html browser-phone dist/
          cp CNAME dist/CNAME
          # camping world (pre-built static bundle) served at /play/
          if [ -d camping-world/play ]; then cp -R camping-world/play dist/play; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/virtual-phone-gift-6027
      - cursor/spaceship-interior-demo-38d1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spaceship/package-lock.json

      - name: Build spaceship game
        run: |
          npm ci --prefix spaceship
          npm run build --prefix spaceship

      - name: Prepare site
        run: |
          mkdir -p dist
          cp -R index.html browser-phone dist/
          cp -R spaceship/dist dist/spaceship
          cp CNAME dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/virtual-phone-gift-6027
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p dist/downloads
          cp -R index.html browser-phone dist/
          cp -R pokemon dist/pokemon
          cp CNAME dist/CNAME
          # offline PC build: unzip anywhere and open index.html
          cd pokemon
          zip -rq ../dist/downloads/pokemon-pc.zip index.html css js data assets README.md
          cd ..

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
